# SlalomDesigner – Deployment auf dem NAS
#
# Voraussetzungen auf dem NAS:
#   1. Einmalig am privaten Registry anmelden:  docker login  (Nutzer maik05)
#   2. Diese Datei als docker-compose.yml ablegen und eine .env daneben legen
#      (siehe deploy/.env.example) mit mindestens JWT_SECRET und POSTGRES_PASSWORD.
#   3. Starten:        docker compose up -d
#      Aktualisieren:  docker compose pull && docker compose up -d
#
# Danach läuft die App (Frontend + API) auf  http://<nas-ip>:3001
# Erster Login: admin@kartslalom.local. Das Passwort wird beim allerersten Start
# (leere DB) EINMALIG in den Container-Logs ausgegeben (oder SEED_PASSWORD setzen).
#   docker compose logs app | grep Passwort

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ksp
      # Starkes Passwort PFLICHT – kein Default. In .env setzen.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}
      POSTGRES_DB: ksp
    # Kein ports:-Eintrag → DB ist nur containerintern erreichbar.
    volumes:
      # WICHTIG – das einzige Volume mit allen Daten: Vereine, Nutzer,
      # Strecken, Maps inkl. Screenshots, Hindernisse, Reglement-PDFs.
      # Dieses Volume sichern = komplettes Backup der App.
      - slalom_dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ksp -d ksp"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    # Multi-Platform-Image (amd64, arm64, armv7) – das NAS zieht
    # automatisch die passende Architektur. Feste Version (reproduzierbar);
    # zum Aktualisieren Tag erhöhen + `docker compose pull && up -d`.
    # Diese Datei braucht KEINEN Quellcode/Dockerfile – nur dieses Image.
    image: maik05/slalom-designer:1.1.0
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://ksp:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}@db:5432/ksp
      # ≥32 Zeichen, zufällig. Pflicht – der Server startet sonst nicht.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET in .env setzen (openssl rand -hex 32)}
      PORT: "3001"
      # Optional, nur fuer den allerersten Start (leere DB):
      # SEED_EMAIL: admin@meinverein.de
      # SEED_PASSWORD: sicheres-passwort   # sonst wird eines erzeugt + 1x geloggt
      # SEED_CLUB: Mein Verein e.V.
    ports:
      - "3001:3001"                   # links anpassen, falls 3001 belegt ist
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy

volumes:
  # Benanntes Volume – bleibt bei "docker compose down" erhalten.
  # Backup/Restore bequem über scripts/db-backup.sh bzw. db-restore.sh
  # (oder die .ps1-Varianten unter Windows).
  slalom_dbdata:
