services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ksp
      POSTGRES_PASSWORD: ksp
      POSTGRES_DB: ksp
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ksp -d ksp"]
      interval: 3s
      timeout: 3s
      retries: 15

  # Lokales Compose (Entwicklung/Single-Host). Produktion auf dem NAS:
  # siehe deploy/docker-compose.nas.yml. JWT_SECRET ist Pflicht (kein Platzhalter).
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://ksp:ksp@db:5432/ksp
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET setzen, z. B. via `openssl rand -hex 32`}
      PORT: "3001"
    ports:
      - "3001:3001"
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
